name: dbt build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the seeds are reproducible
        run: python scripts/generate_data.py && git diff --exit-code seeds/
      - run: dbt build
      - name: Catalogue check (every node documented, classified and owned)
        run: python scripts/check_catalog.py
      - name: Semantic layer check (every metric matches its mart)
        run: python scripts/check_metrics.py
