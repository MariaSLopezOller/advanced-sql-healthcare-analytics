version: 2

# Raw synthetic data written by scripts/generate_data.py (seed 42). No real patients.
seeds:
  - name: raw_departments
    description: Department hierarchy, Hospital > Division > Department.
  - name: raw_physicians
    description: Physicians assigned to leaf departments. Names are staff personal data.
    columns:
      - name: full_name
        config: {meta: {personal_data: direct_identifier}}
  - name: raw_patients
    description: Patient demographics.
    columns:
      - name: birth_date
        config: {meta: {personal_data: quasi_identifier}}
      - name: postal_code
        config: {meta: {personal_data: quasi_identifier}}
  - name: raw_encounters
    description: Outpatient, emergency and inpatient visits in 2025, with cost. Health data.
  - name: raw_diagnoses
    description: ICD-10 codes per encounter, one primary. Health data.
    columns:
      - name: icd10_code
        config: {meta: {personal_data: special_category}}
  - name: raw_prescriptions
    description: Pharmacy fills for chronic treatments. Health data.
    columns:
      - name: drug_name
        config: {meta: {personal_data: special_category}}
  - name: raw_lab_results
    description: HbA1c and LDL results, with three planted entry errors. Health data.
    columns:
      - name: result_value
        config: {meta: {personal_data: special_category}}
  - name: raw_patient_intake
    description: Raw intake forms from several source systems, with duplicates and dirty values.
    columns:
      - name: first_name
        config: {meta: {personal_data: direct_identifier}}
      - name: last_name
        config: {meta: {personal_data: direct_identifier}}
      - name: birth_date
        config: {meta: {personal_data: quasi_identifier}}
      - name: email
        config: {meta: {personal_data: direct_identifier}}
      - name: phone
        config: {meta: {personal_data: direct_identifier}}
